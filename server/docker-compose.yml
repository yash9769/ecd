services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: envista
      POSTGRES_PASSWORD: envista
      POSTGRES_DB: envista
    ports:
      - "5432:5432"
    volumes:
      - envista_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envista"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://envista:envista@db:5432/envista
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-}
    ports:
      - "3001:3001"

volumes:
  envista_pg_data:
