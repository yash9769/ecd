# Backend (Express API) — api.envistacyberdefence.com
#
# A separate subdomain, rather than proxying /api/ under the main
# domain, keeps this simple: no path rewriting, no risk of nginx
# stripping/duplicating the /api prefix, and CORS_ORIGIN in server/.env
# stays a plain origin match. VITE_API_URL for the frontend build is
# https://api.envistacyberdefence.com (no trailing slash, no /api).
#
# Install: copy to /etc/nginx/sites-available/api.envistacyberdefence.com,
# then: sudo ln -s /etc/nginx/sites-available/api.envistacyberdefence.com \
#                  /etc/nginx/sites-enabled/
# Run certbot before uncommenting the 443 block — certbot --nginx
# rewrites this file to add it for you.

server {
    listen 80;
    listen [::]:80;
    server_name api.envistacyberdefence.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
