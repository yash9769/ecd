# Frontend (static build) — envistacyberdefence.com and www.
#
# Install: copy to /etc/nginx/sites-available/envistacyberdefence.com,
# then: sudo ln -s /etc/nginx/sites-available/envistacyberdefence.com \
#                  /etc/nginx/sites-enabled/
# Adjust `root` to wherever you deploy the built frontend (see
# deploy/README.md) and run certbot before uncommenting the 443 block —
# certbot --nginx will rewrite this file to add it for you.

server {
    listen 80;
    listen [::]:80;
    server_name envistacyberdefence.com www.envistacyberdefence.com;

    root /var/www/envistacyberdefence.com/dist;
    index index.html;

    # React Router client-side routing — every unknown path falls back to
    # index.html so the SPA's own router can handle it, instead of nginx
    # returning a 404 for e.g. /capabilities.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself is never cached
    # (the try_files above always re-reads it) so a new deploy is picked
    # up immediately without a manual cache bust.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
